<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="4"/>

  <!-- dezentes Raster -->
  <g stroke="#1e293b" stroke-width="2">
    <line x1="96" y1="160" x2="416" y2="160"/>
    <line x1="96" y1="240" x2="416" y2="240"/>
    <line x1="96" y1="320" x2="416" y2="320"/>
  </g>

  <!-- Chart-Blitz -->
  <polyline points="96,340 178,268 230,300 290,176 330,226 416,120"
            fill="none" stroke="url(#bolt)" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="416" cy="120" r="18" fill="#6366f1" filter="url(#glow)"/>

  <!-- Monogramm -->
  <text x="256" y="440" text-anchor="middle"
        font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="96" font-weight="800" letter-spacing="6" fill="url(#mono)">SC</text>
</svg>
